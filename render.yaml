services:
  - type: web
    name: cashflow-online
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cashflow-online-db
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: EMAIL_DEV_MODE
        value: false
      - key: SHUTDOWN_TIMEOUT_MS
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: ERROR_TRACKING_DSN
        sync: false
      - key: LOG_DRAIN_URL
        sync: false

databases:
  - name: cashflow-online-db
    plan: starter
