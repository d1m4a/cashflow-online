services:
  postgres:
    image: postgres:16-alpine
    container_name: cashflow-online-postgres
    environment:
      POSTGRES_DB: cashflow_online
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow_online"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
